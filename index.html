<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReelSense — Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000000;
      color: #F0F4F0;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .logo-wrap {
      margin-bottom: 48px;
      text-align: center;
    }

    .logo-text {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
    }

    .logo-text span {
      color: #00C853;
    }

    .tagline {
      font-size: 15px;
      color: #607060;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #00C853;
      margin: 0 auto 48px;
      border-radius: 2px;
    }

    .card-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #161E16;
      border: 0.5px solid #2A3A2A;
      border-radius: 16px;
      padding: 22px 24px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: #00C853;
      background: #1A2A1A;
    }

    .card-left { display: flex; align-items: center; gap: 16px; }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(0, 200, 83, 0.12);
      border: 0.5px solid rgba(0, 200, 83, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #F0F4F0;
      margin-bottom: 3px;
    }

    .card-sub {
      font-size: 12px;
      color: #607060;
    }

    .card-arrow {
      color: #2A3A2A;
      font-size: 20px;
      transition: color 0.15s;
    }

    .card:hover .card-arrow { color: #00C853; }

    .footer {
      margin-top: 56px;
      text-align: center;
      font-size: 12px;
      color: #2A3A2A;
      line-height: 1.8;
    }

    .footer a {
      color: #607060;
      text-decoration: none;
    }

    .footer a:hover { color: #00C853; }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <div class="logo-text">REEL<span>SENSE</span></div>
    <div class="tagline">Fish smarter. Every cast.</div>
  </div>

  <div class="divider"></div>

  <div class="card-grid">
    <a class="card" href="/reelsense-legal/privacy-policy">
      <div class="card-left">
        <div class="card-icon">🔒</div>
        <div>
          <div class="card-title">Privacy Policy</div>
          <div class="card-sub">How we handle your data</div>
        </div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <a class="card" href="/reelsense-legal/terms-of-service">
      <div class="card-left">
        <div class="card-icon">📄</div>
        <div>
          <div class="card-title">Terms of Service</div>
          <div class="card-sub">Rules for using ReelSense</div>
        </div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <a class="card" href="mailto:app.support.contactus@gmail.com">
      <div class="card-left">
        <div class="card-icon">✉️</div>
        <div>
          <div class="card-title">Contact Us</div>
          <div class="card-sub">app.support.contactus@gmail.com</div>
        </div>
      </div>
      <div class="card-arrow">›</div>
    </a>
  </div>

  <div class="footer">
    &copy; 2026 ReelSense. All rights reserved.<br/>
    <a href="/reelsense-legal/privacy-policy">Privacy</a> &nbsp;·&nbsp;
    <a href="/reelsense-legal/terms-of-service">Terms</a>
  </div>

</body>
</html>
